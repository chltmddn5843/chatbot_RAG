<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>법률 RAG · 로컬 워크스페이스</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172b29;background:#f4f6f3;line-height:1.65}*{box-sizing:border-box}body{margin:0}header{background:#123e36;color:white;padding:22px max(24px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:20px}header span{font-size:12px;letter-spacing:2px;color:#b6d5c4}main{max-width:1200px;margin:36px auto;padding:0 24px;display:grid;grid-template-columns:1fr 310px;gap:24px}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}h2{font-size:16px;margin:0 0 14px}.sub{color:#60726c;font-size:14px;margin:0 0 26px}.card{background:white;border:1px solid #dbe3dc;border-radius:16px;padding:24px;margin-bottom:18px}.eyebrow{color:#277b60;font-size:12px;font-weight:700;letter-spacing:2px}textarea{width:100%;min-height:130px;resize:vertical;border:1px solid #cbd8ce;border-radius:10px;padding:14px;font:inherit;background:#fcfdfb;margin:10px 0}button{font:inherit;cursor:pointer;border:1px solid #cad8cf;background:#fff;color:#244c3d;border-radius:8px;padding:8px 13px}button:focus-visible,textarea:focus-visible{outline:3px solid #86b99c;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}.primary{background:#185b43;color:white;border:0;padding:11px 22px}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{font-size:12px;color:#687c71}.examples{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}.examples button{font-size:12px}.message{white-space:pre-wrap;overflow-wrap:anywhere}.question{border-left:3px solid #8ab69a;padding-left:14px;color:#50685a;margin-bottom:18px}.answer{font-size:15px}details{border-top:1px solid #e2e8e0;padding-top:12px;margin-top:16px}summary{cursor:pointer;font-weight:600;font-size:13px}.source{font-size:13px;background:#f5f7f3;padding:14px;border-radius:8px;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}.status{font-size:13px;border-bottom:1px solid #e8ece6;padding:11px 0;overflow-wrap:anywhere}.status b{display:block;font-size:11px;color:#7a8a80;letter-spacing:1px}.error{color:#a53829;white-space:pre-wrap;font-size:14px}.empty{color:#7c8d81;text-align:center;padding:32px 10px}.log{border-bottom:1px solid #e3e9df;padding:12px 0;font-size:13px}.log summary{white-space:pre-wrap}.log p{white-space:pre-wrap;overflow-wrap:anywhere}#progress{color:#2c7052;font-size:14px;margin:12px 0}@media(max-width:800px){main{grid-template-columns:1fr;margin-top:22px}aside{grid-row:2}h1{font-size:27px}header span{letter-spacing:0}.card{padding:18px}}
</style>
<header><strong>법률 RAG <span style="margin-left:12px">WORKSPACE</span></strong><span>● LOCAL</span></header>
<main><section><div class="eyebrow">LEGAL KNOWLEDGE ASSISTANT</div><h1>근거를 찾고, 질문을 풀어보세요.</h1><p class="sub">Milvus에서 관련 문서를 검색하고, AI 답변과 검색 근거를 함께 확인합니다.</p>
<form id="form" class="card"><label for="question"><strong>어떤 내용이 궁금하신가요?</strong></label><textarea id="question" maxlength="4000" required placeholder="예: 개인정보 처리자의 안전조치 의무는 무엇인가요?"></textarea><div class="examples"><button type="button">개인정보 보호 의무</button><button type="button">간호사의 업무 범위</button><button type="button">가사근로자의 근로 조건</button></div><div class="actions"><span class="muted">최대 4,000자 · CPU 임베딩</span><button class="primary" id="send">질문 보내기 ↗</button></div><div id="progress" role="status" aria-live="polite"></div><div id="error" class="error" role="alert"></div></form>
<div class="actions" style="margin-bottom:12px"><h2>대화</h2><button id="clear" type="button">화면 비우기</button></div><div id="messages" aria-live="polite"><div class="card empty">첫 질문을 입력하면 답변과 검색 근거가 여기에 표시됩니다.</div></div></section>
<aside><section class="card"><div class="actions"><h2>연결 상태</h2><button id="refresh" type="button" aria-label="연결 상태 새로고침">↻</button></div><div id="status" role="status">확인 중…</div><p class="muted">첫 질문은 임베딩 모델 다운로드로 시간이 걸릴 수 있습니다.</p></section><section class="card"><div class="actions"><h2>최근 저장 로그</h2><button id="reload" type="button">조회</button></div><div id="logs" aria-live="polite" class="muted">조회 버튼을 눌러 저장된 기록을 확인하세요.</div></section></aside></main>
<script>
const $=id=>document.getElementById(id);
function node(tag,text,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;return el}
async function api(path,options){const res=await fetch(path,options);const data=await res.json();if(!res.ok)throw Error(data.error||'요청에 실패했습니다.');return data}
async function refresh(){ $('refresh').disabled=true;try{const s=await api('/api/status');$('status').replaceChildren();for(const [label,value] of [['OPENAI',s.api_key?'API 키 설정됨 (인증 미검증)':'API 키가 필요합니다.'],['POSTGRESQL',s.postgres],['MILVUS',s.milvus]]){const item=node('div','','status');item.append(node('b',label),node('span',value));$('status').append(item)}}catch(e){$('status').textContent=e.message}finally{$('refresh').disabled=false}}
async function logs(){ $('reload').disabled=true;try{const data=await api('/api/logs');$('logs').replaceChildren();if(!data.logs.length)$('logs').textContent='저장된 로그가 없습니다.';for(const log of data.logs){const item=node('details','','log');item.append(node('summary',log.question),node('small',log.created_at),node('p',log.answer));$('logs').append(item)}}catch(e){$('logs').textContent=e.message}finally{$('reload').disabled=false}}
let first=true;
$('form').addEventListener('submit',async e=>{e.preventDefault();const question=$('question').value.trim();if(!question){$('error').textContent='질문을 입력하세요.';return}$('send').disabled=true;$('clear').disabled=true;$('error').textContent='';$('progress').textContent='관련 문서 검색 및 답변 생성 중… 첫 실행은 모델 다운로드가 필요합니다.';try{const data=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});if(first){$('messages').replaceChildren();first=false}const card=node('article','','card');card.append(node('div',question,'question message'),node('div',data.answer,'answer message'));if(data.warning)card.append(node('p',data.warning,'error'));const sources=node('details');sources.append(node('summary',`검색 근거 ${data.sources.length}개`));for(const source of data.sources){sources.append(node('div',`문서 ${source.parent_id??'—'} · 페이지 ${source.page??'—'} · L2 거리 ${Number(source.score).toFixed(3)}\n${source.content}`,'source'))}card.append(sources);$('messages').prepend(card);$('question').value='';logs()}catch(e){$('error').textContent=e.message}finally{$('send').disabled=false;$('clear').disabled=false;$('progress').textContent=''}});
$('clear').onclick=()=>{$('messages').replaceChildren(node('div','대화 화면을 비웠습니다. 저장 로그는 유지됩니다.','card empty'));first=true};
document.querySelectorAll('.examples button').forEach(b=>b.onclick=()=>{$('question').value=b.textContent+'에 대해 알려주세요.';$('question').focus()});$('refresh').onclick=refresh;$('reload').onclick=logs;refresh();
</script></html>
